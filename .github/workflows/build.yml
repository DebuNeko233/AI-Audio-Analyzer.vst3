name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
      bridge: ${{ steps.filter.outputs.bridge }}
      skill: ${{ steps.filter.outputs.skill }}
      release: ${{ steps.filter.outputs.release }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -n "$BASE" ]; then
            CHANGED="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          else
            CHANGED="$(git ls-tree -r --name-only "$GITHUB_SHA")"
          fi
          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          plugin=false
          bridge=false
          skill=false
          release=false
          workflow=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              Source/*|CMakeLists.txt|cmake/*|Resources/*|assets/*) plugin=true ;;
              bridge/*) bridge=true ;;
              skills/ai-analyzer-flstudio/*) skill=true ;;
              release/*|.github/workflows/release.yml) release=true ;;
              .github/workflows/build.yml) workflow=true ;;
            esac
          done <<< "$CHANGED"

          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "bridge=$bridge" >> "$GITHUB_OUTPUT"
          echo "skill=$skill" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin bridge=$bridge skill=$skill release=$release workflow=$workflow"

  release-validate:
    name: Validate release installer (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.release == 'true' || needs.changes.outputs.workflow == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate macOS shell installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash -n release/macos/install.sh
          bash -n release/macos/Install.command
          test -s release/common/START-HERE.md
          test -s release/common/INSTALL.en.md
          test -s release/common/INSTALL.zh-CN.md
      - name: Validate Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $null = [scriptblock]::Create((Get-Content release/windows/Install.ps1 -Raw))
          if (-not (Test-Path release/windows/Install.cmd)) { throw 'Install.cmd missing' }
          Write-Host 'Windows installer syntax OK'

  bridge:
    name: Validate and package MCP / Skill components
    needs: changes
    if: needs.changes.outputs.bridge == 'true' || needs.changes.outputs.skill == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bridge/requirements.txt

      - name: Validate MCP 0.9 source and regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m py_compile \
            bridge/server.py \
            bridge/analyzer_core.py \
            bridge/project_tools.py \
            bridge/temporal_tools.py \
            bridge/masking_tools.py \
            bridge/stereo_tools.py \
            bridge/semantic_tools.py
          AI_ANALYZER_SELF_TEST=1 python bridge/server.py

          python - <<'PY'
          import asyncio
          import sys
          from importlib.metadata import version

          sys.path.insert(0, "bridge")
          import analyzer_core as core
          import server as entry
          import project_tools as project
          import temporal_tools as temporal
          import masking_tools as masking
          import stereo_tools as stereo
          import semantic_tools as semantic
          from mcp.server import MCPServer

          mcp_version = version("mcp")
          assert mcp_version.split(".", 1)[0] == "2", mcp_version
          assert isinstance(entry.mcp, MCPServer)
          assert entry.mcp is core.mcp
          assert entry.MCP_VERSION == "0.9"
          assert entry.OSC_PROTOCOL_VERSION == "0.9"

          names = {tool.name for tool in asyncio.run(entry.mcp.list_tools())}
          assert names == entry.EXPECTED_TOOLS, sorted(names ^ entry.EXPECTED_TOOLS)
          assert len(names) == 24

          with core._lock:
              core._tracks.clear()
              core._history.clear()
              core._bindings.clear()
              core._identify_events.clear()
              core._identify_sequence = 0
          with project._snapshot_lock:
              project._project_snapshots.clear()

          major = [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88]
          total_major = sum(major)
          chroma_c_major = [value / total_major for value in major]
          g_major_raw = major[5:] + major[:5]
          total_g = sum(g_major_raw)
          chroma_g_major = [value / total_g for value in g_major_raw]

          def frame(
              name,
              runtime_id,
              timestamp,
              bands,
              peak=-14.0,
              rms=-24.0,
              flux=0.08,
              rise=1.0,
              side_offset_db=-12.0,
              side_to_mid_db=-9.0,
              negative_cross=0.08,
              low_corr=0.92,
              low_side_to_mid_db=-15.0,
              chroma=None,
              chroma_energy_ratio=0.72,
              harmonic_ratio=0.58,
              harmonic_f0_hz=130.81,
          ):
              prefix = [
                  name, 48000.0, timestamp, peak, rms, peak-rms,
                  700.0, 6000.0, 0.15, 0.75, 0.25,
              ] + list(bands)
              v02 = [-18.0, -14.0, -1.0, -0.5] + [0.85] * 8
              v03 = [1, peak, 0.0, runtime_id]
              v06 = [0.1, flux * 0.5, flux, rise, -28.0, "0.6"]
              side_bands = [float(value) + side_offset_db for value in bands]
              band_side_mid = [-18.0, -16.0, -14.0, -12.0, -10.0, -8.0, -6.0, -4.0]
              v08 = [
                  rms - 1.0,
                  rms - 10.0,
                  side_to_mid_db,
                  negative_cross,
                  low_corr,
                  low_side_to_mid_db,
              ] + side_bands + band_side_mid + ["0.8"]
              semantic_chroma = list(chroma if chroma is not None else chroma_c_major)
              v09 = semantic_chroma + [
                  chroma_energy_ratio,
                  harmonic_ratio,
                  harmonic_f0_hz,
                  "0.9",
              ]
              return prefix + v02 + v03 + v06 + v08 + v09

          shape_a = [-55.0 + min(i, 12) * 1.8 for i in range(32)]
          shape_b = [value + 2.0 for value in shape_a]
          for i in range(8):
              swing = [0.0, 3.0, 8.0, 4.0, -1.0, 6.0, 2.0, 0.0][i]
              bands_a = [value + swing for value in shape_a]
              bands_b = [value + swing * 0.9 + 1.5 for value in shape_b]
              flux = 0.24 if i in (2, 5) else 0.06
              rise = 5.0 if i in (2, 5) else 0.8
              core._on_frame(
                  "/aianalyzer/frame",
                  *frame(
                      "Bass A",
                      "uuid-a",
                      10.0 + i * 0.1,
                      bands_a,
                      flux=flux,
                      rise=rise,
                      negative_cross=0.05 + i * 0.005,
                      low_corr=0.94 - i * 0.005,
                      chroma=chroma_c_major,
                      chroma_energy_ratio=0.74,
                      harmonic_ratio=0.62 - i * 0.01,
                      harmonic_f0_hz=130.81,
                  ),
              )
              core._on_frame(
                  "/aianalyzer/frame",
                  *frame(
                      "Bass B",
                      "uuid-b",
                      10.01 + i * 0.1,
                      bands_b,
                      peak=-16.0,
                      rms=-26.0,
                      flux=flux * 0.9,
                      rise=rise * 0.9,
                      side_offset_db=-7.0,
                      side_to_mid_db=-5.0,
                      negative_cross=0.22 + i * 0.01,
                      low_corr=0.70 - i * 0.01,
                      low_side_to_mid_db=-9.0,
                      chroma=chroma_g_major,
                      chroma_energy_ratio=0.68,
                      harmonic_ratio=0.48 + i * 0.005,
                      harmonic_f0_hz=98.0,
                  ),
              )

          assert core._tracks["uuid-a"]["temporal_supported"] is True
          assert core._tracks["uuid-a"]["stereo_v08_supported"] is True
          assert core._tracks["uuid-a"]["semantic_v09_supported"] is True
          assert core._tracks["uuid-a"]["semantic_v09_valid"] is True
          assert core._tracks["uuid-a"]["schema_version"] == "0.9"
          assert len(core._tracks["uuid-a"]["side_bands_db"]) == 32
          assert len(core._tracks["uuid-a"]["band_side_to_mid_db"]) == 8
          assert len(core._tracks["uuid-a"]["chroma"]) == 12
          assert abs(sum(core._tracks["uuid-a"]["chroma"]) - 1.0) < 1e-6

          core._on_identify("/aianalyzer/identify", "uuid-a", "Bass A", 11.0, "0.4")
          bound = core.audio_bind_last_identified(7, "Bass A", 9)
          assert bound["selector"] == "mixer:7/slot:9"
          assert core._resolve_track("mixer:7/slot:9") == "uuid-a"

          profile = temporal.audio_temporal_profile("uuid-a", 5.0)
          assert profile["available"] is True
          assert profile["onset_candidate_frames"] >= 1

          temporal_pair = temporal.audio_temporal_compare("uuid-a", "uuid-b", 5.0, 40.0, 160.0, 80.0)
          assert temporal_pair["available"] is True
          assert temporal_pair["aligned_pairs"] >= 6
          assert temporal_pair["normalized_band_temporal_overlap"] is not None

          evidence = masking.audio_masking_evidence("uuid-a", "uuid-b", 5.0, 80.0, 6)
          assert evidence["available"] is True
          assert evidence["auditory_band_model"]["type"] == "equal-erb-rate-rebinning"
          assert evidence["auditory_band_model"]["filterbank"] is False
          assert len(evidence["strongest_regions"]) == 6
          assert evidence["strongest_regions"][0]["combined_evidence_a_over_b"] is not None
          assert evidence["masking_evidence_score"] is not None

          scan = masking.audio_project_masking_scan(5.0, 4, 80.0)
          assert scan["candidate_pair_count"] >= 1
          assert scan["pairs"][0]["top_region"] is not None

          stereo_a = stereo.audio_stereo_profile("uuid-a", 5.0)
          stereo_b = stereo.audio_stereo_profile("uuid-b", 5.0)
          assert stereo_a["available"] is True
          assert stereo_b["available"] is True
          assert len(stereo_a["mid_spectrum_db"]) == 32
          assert len(stereo_a["side_spectrum_db"]) == 32
          assert len(stereo_a["frequency_dependent_stereo"]) == 8
          assert stereo_a["full_band"]["decorrelation_proxy_mean"] is not None
          assert stereo_a["full_band"]["negative_cross_energy_ratio_mean"] is not None
          assert stereo_b["full_band"]["side_to_mid_db"] > stereo_a["full_band"]["side_to_mid_db"]

          stereo_delta = stereo.audio_stereo_compare("uuid-a", "uuid-b", 5.0)
          assert stereo_delta["available"] is True
          assert stereo_delta["deltas_b_minus_a"]["side_to_mid_db"] is not None
          assert len(stereo_delta["frequency_dependent_deltas"]) == 8

          tonal_a = semantic.audio_tonal_profile("uuid-a", 5.0)
          tonal_b = semantic.audio_tonal_profile("uuid-b", 5.0)
          assert tonal_a["available"] is True
          assert tonal_b["available"] is True
          assert len(tonal_a["chroma"]["normalized_power"]) == 12
          assert tonal_a["tonal_center_evidence"]["top_candidates"][0]["label"] == "C major"
          assert tonal_a["tonal_center_evidence"]["top2_margin"] is not None
          assert tonal_a["chroma"]["normalized_entropy"] is not None
          assert tonal_a["harmonic_alignment"]["single_f0_harmonic_energy_ratio_mean"] is not None

          tonal_delta = semantic.audio_tonal_compare("uuid-a", "uuid-b", 5.0)
          assert tonal_delta["available"] is True
          assert tonal_delta["pitch_class_comparison"]["cosine_similarity"] is not None
          assert tonal_delta["pitch_class_comparison"]["jensen_shannon_divergence"] is not None
          assert len(tonal_delta["pitch_class_comparison"]["normalized_power_delta_b_minus_a"]) == 12

          before = project.audio_capture_snapshot("before", 5.0)
          assert before["track_count"] == 2
          assert project.audio_list_snapshots()["count"] == 1

          print(
              f"AI Audio Analyzer MCP SDK {mcp_version}: {len(names)} tools; "
              "single server.py entrypoint + V0.4 mapping + V0.5 project A/B + "
              "V0.6 temporal + V0.7 masking + V0.8 stereo + V0.9 tonal evidence OK"
          )
          PY

      - name: Package MCP and Skill folders
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/mcp dist/skill
          cp bridge/server.py dist/mcp/
          cp bridge/analyzer_core.py dist/mcp/
          cp bridge/project_tools.py dist/mcp/
          cp bridge/temporal_tools.py dist/mcp/
          cp bridge/masking_tools.py dist/mcp/
          cp bridge/stereo_tools.py dist/mcp/
          cp bridge/semantic_tools.py dist/mcp/
          cp bridge/requirements.txt dist/mcp/
          cp bridge/cherry-studio.example.json dist/mcp/
          cp -R skills/ai-analyzer-flstudio/. dist/skill/
          find dist -maxdepth 3 -type f -print | sort

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Analyzer-Components
          path: dist/
          if-no-files-found: error
          include-hidden-files: true

  plugin:
    name: Build VST3 (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure macOS arm64
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Configure Windows x64
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build --config Release --parallel 2

      - name: Package macOS development artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/mcp dist/skill
          VST3_PATH="$(find build/AIAnalyzer_artefacts -type d -name 'AI Audio Analyzer.vst3' -print -quit)"
          test -n "$VST3_PATH"
          BINARY="$VST3_PATH/Contents/MacOS/AI Audio Analyzer"
          test "$(lipo -archs "$BINARY")" = "arm64"
          xattr -cr "$VST3_PATH" || true
          codesign --force --deep --sign - --timestamp=none "$VST3_PATH"
          codesign --verify --deep --strict --verbose=4 "$VST3_PATH"
          ditto "$VST3_PATH" "dist/AI Audio Analyzer.vst3"
          cp bridge/*.py bridge/requirements.txt bridge/cherry-studio.example.json dist/mcp/
          cp -R skills/ai-analyzer-flstudio/. dist/skill/

      - name: Package Windows development artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Path 'dist/mcp','dist/skill' -Force | Out-Null
          $vst3 = Get-ChildItem build/AIAnalyzer_artefacts -Recurse -Directory -Filter 'AI Audio Analyzer.vst3' | Select-Object -First 1
          if (-not $vst3) { throw 'AI Audio Analyzer.vst3 not found' }
          Copy-Item $vst3.FullName 'dist/AI Audio Analyzer.vst3' -Recurse -Force
          Copy-Item bridge/*.py,bridge/requirements.txt,bridge/cherry-studio.example.json 'dist/mcp/' -Force
          Copy-Item 'skills/ai-analyzer-flstudio/*' 'dist/skill/' -Recurse -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Analyzer-${{ runner.os }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
