name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Check Python bridge dependencies and import
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m py_compile bridge/server.py
          python -c "import sys; sys.path.insert(0, 'bridge'); import server; print('AI Analyzer bridge import OK')"

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          VST3_PATH="$(find build/AIAnalyzer_artefacts -type d -name 'AI Analyzer.vst3' -print -quit)"
          if [ -z "$VST3_PATH" ]; then
            echo "AI Analyzer.vst3 bundle not found" >&2
            exit 1
          fi

          BINARY="$VST3_PATH/Contents/MacOS/AI Analyzer"

          echo "Architectures: $(lipo -archs "$BINARY")"
          echo "Mach-O deployment info:"
          otool -l "$BINARY" | awk '
            /LC_BUILD_VERSION/ { show=1; count=0 }
            show { print; count++ }
            show && count >= 7 { show=0 }
          '

          # JUCE generates moduleinfo.json near the end of the VST3 build. Re-sign
          # the final bundle after all resources exist, then fail CI if the bundle
          # is not internally valid.
          xattr -cr "$VST3_PATH" || true
          codesign --force --deep --sign - --timestamp=none "$VST3_PATH"
          codesign --verify --deep --strict --verbose=4 "$VST3_PATH"

          # Preserve the macOS bundle layout, executable bits, metadata and final
          # ad-hoc signature inside an inner ZIP. Users unzip this file and copy
          # AI Analyzer.vst3 to ~/Library/Audio/Plug-Ins/VST3/.
          ditto -c -k --sequesterRsrc --keepParent \
            "$VST3_PATH" \
            "dist/AI-Analyzer-macOS.vst3.zip"

          # The bridge is a separate archive so users can place it anywhere.
          (
            cd bridge
            zip -9 -r ../dist/bridge.zip \
              server.py \
              requirements.txt \
              cherry-studio.example.json
          )

          echo "Package contents:"
          ls -lh dist

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Path dist | Out-Null

          $vst3 = Get-ChildItem -Path build/AIAnalyzer_artefacts -Recurse -Directory -Filter 'AI Analyzer.vst3' | Select-Object -First 1
          if (-not $vst3) {
            throw 'AI Analyzer.vst3 bundle not found'
          }

          # Package the complete VST3 directory to avoid any transport layer
          # changing the bundle layout or file attributes.
          Compress-Archive -Path $vst3.FullName -DestinationPath 'dist/AI-Analyzer-Windows.vst3.zip' -CompressionLevel Optimal

          $bridgeFiles = @(
            'bridge/server.py',
            'bridge/requirements.txt',
            'bridge/cherry-studio.example.json'
          )
          Compress-Archive -Path $bridgeFiles -DestinationPath 'dist/bridge.zip' -CompressionLevel Optimal

          Write-Host 'Package contents:'
          Get-ChildItem -Path dist | Select-Object Name, Length

      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: AI-Analyzer-${{ runner.os }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
