name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
      bridge: ${{ steps.filter.outputs.bridge }}
      skill: ${{ steps.filter.outputs.skill }}
      release: ${{ steps.filter.outputs.release }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -n "$BASE" ]; then
            CHANGED="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          else
            CHANGED="$(git ls-tree -r --name-only "$GITHUB_SHA")"
          fi

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          plugin=false
          bridge=false
          skill=false
          release=false
          workflow=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              Source/*|CMakeLists.txt|cmake/*|Resources/*|assets/*)
                plugin=true
                ;;
              bridge/*)
                bridge=true
                ;;
              skills/ai-analyzer-flstudio/*)
                skill=true
                ;;
              release/*|.github/workflows/release.yml)
                release=true
                ;;
              .github/workflows/build.yml)
                workflow=true
                ;;
            esac
          done <<< "$CHANGED"

          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "bridge=$bridge" >> "$GITHUB_OUTPUT"
          echo "skill=$skill" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"

          echo "plugin=$plugin bridge=$bridge skill=$skill release=$release workflow=$workflow"

  release-validate:
    name: Validate release installer (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.release == 'true' || needs.changes.outputs.workflow == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate macOS shell installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash -n release/macos/install.sh
          bash -n release/macos/Install.command
          test -s release/common/START-HERE.md
          test -s release/common/INSTALL.en.md
          test -s release/common/INSTALL.zh-CN.md

      - name: Validate Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $null = [scriptblock]::Create((Get-Content release/windows/Install.ps1 -Raw))
          if (-not (Test-Path release/windows/Install.cmd)) { throw 'Install.cmd missing' }
          Write-Host 'Windows installer syntax OK'

  bridge:
    name: Validate and package MCP / skill components
    needs: changes
    if: needs.changes.outputs.bridge == 'true' || needs.changes.outputs.skill == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python MCP v2 bridge
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m py_compile bridge/server.py
          python - <<'PY'
          import asyncio
          import sys
          from importlib.metadata import version

          sys.path.insert(0, "bridge")
          import server
          from mcp.server import MCPServer

          mcp_version = version("mcp")
          assert mcp_version.split(".", 1)[0] == "2", mcp_version
          assert isinstance(server.mcp, MCPServer)

          tools = asyncio.run(server.mcp.list_tools())
          names = {tool.name for tool in tools}
          expected = {
              "audio_bridge_status",
              "audio_list_tracks",
              "audio_last_identify",
              "audio_bind_last_identified",
              "audio_instance_map",
              "audio_snapshot",
              "audio_average",
              "audio_stereo_bands",
              "audio_compare_tracks",
              "audio_detect_masking",
              "audio_master_status",
          }
          missing = expected - names
          assert not missing, f"Missing MCP tools: {sorted(missing)}"

          base = [
              "Bass", 48000.0, 1.0, -20.0, -30.0, 10.0,
              500.0, 5000.0, 0.1, 0.8, 0.2,
          ] + [-40.0] * 32 + [-18.0, -14.0, -1.0, -0.5] + [0.9] * 8

          with server._lock:
              server._tracks.clear()
              server._history.clear()
              server._bindings.clear()
              server._identify_events.clear()
              server._identify_sequence = 0

          server._on_frame("/aianalyzer/frame", *(base + [1, -20.0, 0.0, "uuid-a"]))
          server._on_frame("/aianalyzer/frame", *(base + [1, -20.0, 0.0, "uuid-b"]))
          assert len(server._tracks) == 2

          try:
              server._resolve_track("Bass")
          except ValueError as exc:
              assert "Ambiguous analyzer instance name" in str(exc)
          else:
              raise AssertionError("Duplicate analyzer names must be ambiguous before binding")

          server._on_identify("/aianalyzer/identify", "uuid-a", "Bass", 2.0, "0.4")
          last = server.audio_last_identify()
          assert last["runtime_id"] == "uuid-a"
          assert last["consumed"] is False

          bound = server.audio_bind_last_identified(7, "Bass Sub", 9)
          assert bound["binding"]["runtime_id"] == "uuid-a"
          assert server._resolve_track("mixer:7/slot:9") == "uuid-a"
          assert server._resolve_track("Bass Sub") == "uuid-a"

          try:
              server.audio_bind_last_identified(8, "Wrong Bass", 9)
          except ValueError as exc:
              assert "already consumed" in str(exc)
          else:
              raise AssertionError("An Identify event must not bind twice")

          topology = server.audio_instance_map()
          assert topology["bound_count"] == 1
          assert topology["unbound_count"] == 1

          silent = list(base)
          silent[3] = -80.0
          server._on_frame("/aianalyzer/frame", *(silent + [0, -80.0, 4.0, "uuid-a"]))
          snapshot = server._snapshot("mixer:7/slot:9")
          assert snapshot["signal_present"] is False
          assert snapshot["bands_db"] is None
          assert snapshot["stereo_correlation"] is None
          assert snapshot["lufs_s"] is None
          assert snapshot["lufs_i"] == -14.0
          assert snapshot["binding"]["fl_track_name"] == "Bass Sub"

          print(
              f"AI Audio Analyzer MCP v{mcp_version}: {len(names)} tools registered; "
              "V0.4 identify/mapping protocol OK"
          )
          PY

      - name: Package MCP and skill folders
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/mcp dist/skill

          cp bridge/server.py dist/mcp/
          cp bridge/requirements.txt dist/mcp/
          cp bridge/cherry-studio.example.json dist/mcp/
          cp -R skills/ai-analyzer-flstudio/. dist/skill/

          echo "Component artifact contents:"
          find dist -maxdepth 3 -type f -print | sort

      - name: Upload component artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Analyzer-Components
          path: dist/
          if-no-files-found: error
          include-hidden-files: true

  plugin:
    name: Build VST3 (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel 2

      - name: Package macOS three-part artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/mcp dist/skill

          VST3_PATH="$(find build/AIAnalyzer_artefacts -type d -name 'AI Audio Analyzer.vst3' -print -quit)"
          if [ -z "$VST3_PATH" ]; then
            echo "AI Audio Analyzer.vst3 bundle not found" >&2
            exit 1
          fi

          BINARY="$VST3_PATH/Contents/MacOS/AI Audio Analyzer"

          echo "Architectures: $(lipo -archs "$BINARY")"
          echo "Mach-O deployment info:"
          otool -l "$BINARY" | awk '
            /LC_BUILD_VERSION/ { show=1; count=0 }
            show { print; count++ }
            show && count >= 7 { show=0 }
          '

          xattr -cr "$VST3_PATH" || true
          codesign --force --deep --sign - --timestamp=none "$VST3_PATH"
          codesign --verify --deep --strict --verbose=4 "$VST3_PATH"

          ditto "$VST3_PATH" "dist/AI Audio Analyzer.vst3"

          cp bridge/server.py dist/mcp/
          cp bridge/requirements.txt dist/mcp/
          cp bridge/cherry-studio.example.json dist/mcp/
          cp -R skills/ai-analyzer-flstudio/. dist/skill/

          echo "Install artifact top level:"
          find dist -maxdepth 1 -mindepth 1 -print | sort

      - name: Package Windows three-part artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Path 'dist/mcp' -Force | Out-Null
          New-Item -ItemType Directory -Path 'dist/skill' -Force | Out-Null

          $vst3 = Get-ChildItem -Path build/AIAnalyzer_artefacts -Recurse -Directory -Filter 'AI Audio Analyzer.vst3' | Select-Object -First 1
          if (-not $vst3) {
            throw 'AI Audio Analyzer.vst3 bundle not found'
          }

          Copy-Item -Path $vst3.FullName -Destination 'dist/AI Audio Analyzer.vst3' -Recurse -Force

          Copy-Item 'bridge/server.py' 'dist/mcp/server.py'
          Copy-Item 'bridge/requirements.txt' 'dist/mcp/requirements.txt'
          Copy-Item 'bridge/cherry-studio.example.json' 'dist/mcp/cherry-studio.example.json'
          Copy-Item 'skills/ai-analyzer-flstudio/*' 'dist/skill/' -Recurse -Force

          Write-Host 'Install artifact top level:'
          Get-ChildItem -Path dist | Select-Object Name, Mode

      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Analyzer-${{ runner.os }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
