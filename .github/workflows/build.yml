name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
      bridge: ${{ steps.filter.outputs.bridge }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -n "$BASE" ]; then
            CHANGED="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          else
            CHANGED="$(git ls-tree -r --name-only "$GITHUB_SHA")"
          fi

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          plugin=false
          bridge=false
          workflow=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              Source/*|CMakeLists.txt|cmake/*|Resources/*|assets/*)
                plugin=true
                ;;
              bridge/*)
                bridge=true
                ;;
              .github/workflows/build.yml)
                workflow=true
                ;;
            esac
          done <<< "$CHANGED"

          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "bridge=$bridge" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"

          echo "plugin=$plugin bridge=$bridge workflow=$workflow"

  bridge:
    name: Validate and package MCP v2 bridge
    needs: changes
    if: needs.changes.outputs.bridge == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python MCP v2 bridge
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m py_compile bridge/server.py
          python - <<'PY'
          import asyncio
          import sys
          from importlib.metadata import version

          sys.path.insert(0, "bridge")
          import server
          from mcp.server import MCPServer

          mcp_version = version("mcp")
          assert mcp_version.split(".", 1)[0] == "2", mcp_version
          assert isinstance(server.mcp, MCPServer)

          tools = asyncio.run(server.mcp.list_tools())
          names = {tool.name for tool in tools}
          expected = {
              "audio_bridge_status",
              "audio_list_tracks",
              "audio_snapshot",
              "audio_average",
              "audio_stereo_bands",
              "audio_compare_tracks",
              "audio_detect_masking",
              "audio_master_status",
          }
          missing = expected - names
          assert not missing, f"Missing MCP tools: {sorted(missing)}"

          # V0.3 protocol smoke test: two same-name instances must coexist and
          # resolving by the duplicate human name must fail as ambiguous.
          base = [
              "Bass", 48000.0, 1.0, -20.0, -30.0, 10.0,
              500.0, 5000.0, 0.1, 0.8, 0.2,
          ] + [-40.0] * 32 + [-18.0, -14.0, -1.0, -0.5] + [0.9] * 8

          with server._lock:
              server._tracks.clear()
              server._history.clear()

          server._on_frame("/aianalyzer/frame", *(base + [1, -20.0, 0.0, "uuid-a"]))
          server._on_frame("/aianalyzer/frame", *(base + [1, -20.0, 0.0, "uuid-b"]))
          assert len(server._tracks) == 2

          try:
              server._resolve_track("Bass")
          except ValueError as exc:
              assert "Ambiguous analyzer instance name" in str(exc)
          else:
              raise AssertionError("Duplicate analyzer names must be ambiguous")

          # Silent V0.3 frame: spectral/stereo outputs must become None while
          # LUFS-I remains a valid accumulated session value.
          silent = list(base)
          silent[3] = -80.0
          server._on_frame("/aianalyzer/frame", *(silent + [0, -80.0, 4.0, "uuid-a"]))
          snapshot = server._snapshot("uuid-a")
          assert snapshot["signal_present"] is False
          assert snapshot["bands_db"] is None
          assert snapshot["stereo_correlation"] is None
          assert snapshot["lufs_s"] is None
          assert snapshot["lufs_i"] == -14.0

          print(f"AI Audio Analyzer MCP v{mcp_version}: {len(names)} tools registered; V0.3 protocol OK")
          PY

      - name: Package bridge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          (
            cd bridge
            zip -9 -r ../dist/bridge.zip \
              server.py \
              requirements.txt \
              cherry-studio.example.json
          )

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Analyzer-Bridge
          path: dist/bridge.zip
          if-no-files-found: error

  plugin:
    name: Build VST3 (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel 2

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          VST3_PATH="$(find build/AIAnalyzer_artefacts -type d -name 'AI Audio Analyzer.vst3' -print -quit)"
          if [ -z "$VST3_PATH" ]; then
            echo "AI Audio Analyzer.vst3 bundle not found" >&2
            exit 1
          fi

          BINARY="$VST3_PATH/Contents/MacOS/AI Audio Analyzer"

          echo "Architectures: $(lipo -archs "$BINARY")"
          echo "Mach-O deployment info:"
          otool -l "$BINARY" | awk '
            /LC_BUILD_VERSION/ { show=1; count=0 }
            show { print; count++ }
            show && count >= 7 { show=0 }
          '

          xattr -cr "$VST3_PATH" || true
          codesign --force --deep --sign - --timestamp=none "$VST3_PATH"
          codesign --verify --deep --strict --verbose=4 "$VST3_PATH"

          ditto -c -k --sequesterRsrc --keepParent \
            "$VST3_PATH" \
            "dist/AI-Audio-Analyzer-macOS.vst3.zip"

          (
            cd bridge
            zip -9 -r ../dist/bridge.zip \
              server.py \
              requirements.txt \
              cherry-studio.example.json
          )

          echo "Package contents:"
          ls -lh dist

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Path dist | Out-Null

          $vst3 = Get-ChildItem -Path build/AIAnalyzer_artefacts -Recurse -Directory -Filter 'AI Audio Analyzer.vst3' | Select-Object -First 1
          if (-not $vst3) {
            throw 'AI Audio Analyzer.vst3 bundle not found'
          }

          Compress-Archive -Path $vst3.FullName -DestinationPath 'dist/AI-Audio-Analyzer-Windows.vst3.zip' -CompressionLevel Optimal

          $bridgeFiles = @(
            'bridge/server.py',
            'bridge/requirements.txt',
            'bridge/cherry-studio.example.json'
          )
          Compress-Archive -Path $bridgeFiles -DestinationPath 'dist/bridge.zip' -CompressionLevel Optimal

          Write-Host 'Package contents:'
          Get-ChildItem -Path dist | Select-Object Name, Length

      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Analyzer-${{ runner.os }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
