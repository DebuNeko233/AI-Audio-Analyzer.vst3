name: build

on:
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'Resources/**'
      - 'assets/**'
      - 'bridge/**'
      - 'skills/ai-analyzer-flstudio/**'
      - 'release/common/START-HERE.md'
      - 'release/common/INSTALL.en.md'
      - 'release/common/INSTALL.zh-CN.md'
      - 'release/windows/Install.ps1'
      - 'release/windows/Install.cmd'
      - 'release/macos/install.sh'
      - 'release/macos/Install.command'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'Resources/**'
      - 'assets/**'
      - 'bridge/**'
      - 'skills/ai-analyzer-flstudio/**'
      - 'release/common/START-HERE.md'
      - 'release/common/INSTALL.en.md'
      - 'release/common/INSTALL.zh-CN.md'
      - 'release/windows/Install.ps1'
      - 'release/windows/Install.cmd'
      - 'release/macos/install.sh'
      - 'release/macos/Install.command'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
      bridge: ${{ steps.filter.outputs.bridge }}
      skill: ${{ steps.filter.outputs.skill }}
      release: ${{ steps.filter.outputs.release }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          # PR synchronize runs compare only the previous and current PR heads.
          # This prevents an older plugin change elsewhere in the PR from
          # forcing another VST3 build after a later docs/MCP-only commit.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.action }}" = "synchronize" ] && [ -n "${{ github.event.before }}" ]; then
              BASE="${{ github.event.before }}"
            else
              BASE="${{ github.event.pull_request.base.sha }}"
            fi
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -n "$BASE" ]; then
            CHANGED="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          else
            CHANGED="$(git ls-tree -r --name-only "$GITHUB_SHA")"
          fi
          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          plugin=false
          bridge=false
          skill=false
          release=false
          workflow=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              Source/*|CMakeLists.txt|cmake/*|Resources/*|assets/*) plugin=true ;;
              bridge/*) bridge=true ;;
              skills/ai-analyzer-flstudio/*) skill=true ;;
              release/common/START-HERE.md|release/common/INSTALL.en.md|release/common/INSTALL.zh-CN.md|release/windows/Install.ps1|release/windows/Install.cmd|release/macos/install.sh|release/macos/Install.command|.github/workflows/release.yml) release=true ;;
              .github/workflows/build.yml) workflow=true ;;
            esac
          done <<< "$CHANGED"

          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "bridge=$bridge" >> "$GITHUB_OUTPUT"
          echo "skill=$skill" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin bridge=$bridge skill=$skill release=$release workflow=$workflow"

  release-validate:
    name: Validate release installer (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.release == 'true' || needs.changes.outputs.workflow == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate macOS shell installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash -n release/macos/install.sh
          bash -n release/macos/Install.command
          test -s release/common/START-HERE.md
          test -s release/common/INSTALL.en.md
          test -s release/common/INSTALL.zh-CN.md
      - name: Validate Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $null = [scriptblock]::Create((Get-Content release/windows/Install.ps1 -Raw))
          if (-not (Test-Path release/windows/Install.cmd)) { throw 'Install.cmd missing' }
          Write-Host 'Windows installer syntax OK'

  bridge:
    name: Validate and package MCP / Skill components
    needs: changes
    if: needs.changes.outputs.bridge == 'true' || needs.changes.outputs.skill == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bridge/requirements.txt

      - name: Validate MCP 1.1 source and regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m py_compile \
            bridge/server.py \
            bridge/analyzer_core.py \
            bridge/project_tools.py \
            bridge/temporal_tools.py \
            bridge/masking_tools.py \
            bridge/stereo_tools.py \
            bridge/semantic_tools.py \
            bridge/performance_tools.py \
            bridge/verification_tools.py \
            bridge/ci_regression.py
          AI_ANALYZER_SELF_TEST=1 python bridge/server.py
          python bridge/ci_regression.py

      - name: Package MCP and Skill folders
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/mcp dist/skill
          cp bridge/server.py dist/mcp/
          cp bridge/analyzer_core.py dist/mcp/
          cp bridge/project_tools.py dist/mcp/
          cp bridge/temporal_tools.py dist/mcp/
          cp bridge/masking_tools.py dist/mcp/
          cp bridge/stereo_tools.py dist/mcp/
          cp bridge/semantic_tools.py dist/mcp/
          cp bridge/performance_tools.py dist/mcp/
          cp bridge/verification_tools.py dist/mcp/
          cp bridge/requirements.txt dist/mcp/
          cp bridge/cherry-studio.example.json dist/mcp/
          cp -R skills/ai-analyzer-flstudio/. dist/skill/
          find dist -maxdepth 3 -type f -print | sort

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Analyzer-Components
          path: dist/
          if-no-files-found: error
          include-hidden-files: true

  plugin:
    name: Build VST3 (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true' || needs.changes.outputs.workflow == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Cache the platform-specific CMake tree, not just the JUCE checkout. This
      # preserves FetchContent state and reusable JUCE module object files while
      # every run still reconfigures and rebuilds the current source tree.
      - name: Restore CMake / JUCE incremental build cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-${{ runner.arch }}-juce-cmake-${{ hashFiles('CMakeLists.txt', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-juce-cmake-

      - name: Configure macOS arm64
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Configure Windows x64
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build --config Release --parallel 2

      - name: Package macOS development artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/mcp dist/skill
          VST3_PATH="$(find build/AIAnalyzer_artefacts -type d -name 'AI Audio Analyzer.vst3' -print -quit)"
          test -n "$VST3_PATH"
          BINARY="$VST3_PATH/Contents/MacOS/AI Audio Analyzer"
          test "$(lipo -archs "$BINARY")" = "arm64"
          xattr -cr "$VST3_PATH" || true
          codesign --force --deep --sign - --timestamp=none "$VST3_PATH"
          codesign --verify --deep --strict --verbose=4 "$VST3_PATH"
          ditto "$VST3_PATH" "dist/AI Audio Analyzer.vst3"
          cp bridge/*.py bridge/requirements.txt bridge/cherry-studio.example.json dist/mcp/
          cp -R skills/ai-analyzer-flstudio/. dist/skill/

      - name: Package Windows development artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Path 'dist/mcp','dist/skill' -Force | Out-Null
          $vst3 = Get-ChildItem build/AIAnalyzer_artefacts -Recurse -Directory -Filter 'AI Audio Analyzer.vst3' | Select-Object -First 1
          if (-not $vst3) { throw 'AI Audio Analyzer.vst3 not found' }
          Copy-Item $vst3.FullName 'dist/AI Audio Analyzer.vst3' -Recurse -Force
          Copy-Item bridge/*.py,bridge/requirements.txt,bridge/cherry-studio.example.json 'dist/mcp/' -Force
          Copy-Item 'skills/ai-analyzer-flstudio/*' 'dist/skill/' -Recurse -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Analyzer-${{ runner.os }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
