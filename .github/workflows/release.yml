name: release-lazy-package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag. Leave empty to use v<CMake project version>.'
        required: false
        type: string
      prerelease:
        description: 'Publish as prerelease'
        required: true
        default: false
        type: boolean
      draft:
        description: 'Create/update as draft release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ai-audio-analyzer-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts, docs and MCP source
        shell: bash
        run: |
          set -euo pipefail
          bash -n release/macos/install.sh
          bash -n release/macos/Install.command
          test -s release/windows/Install.ps1
          test -s release/windows/Install.cmd
          test -s release/common/START-HERE.md
          test -s release/common/INSTALL.en.md
          test -s release/common/INSTALL.zh-CN.md
          python -m py_compile \
            bridge/server.py \
            bridge/server_v05.py \
            bridge/project_tools.py \
            bridge/server_v06.py \
            bridge/temporal_tools.py \
            bridge/server_v07.py \
            bridge/masking_tools.py

  mcp-runtime:
    name: MCP runtime (${{ matrix.label }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            artifact: mcp-runtime-windows-x64
          - os: macos-latest
            label: macos-arm64
            artifact: mcp-runtime-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bridge/requirements.txt

      - name: Install MCP build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m pip install 'pyinstaller>=6.10,<7'

      - name: Validate source MCP 0.7
        shell: bash
        run: |
          AI_ANALYZER_SELF_TEST=1 python bridge/server_v07.py

      - name: Build standalone MCP runtime
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --name ai-audio-analyzer-mcp \
            --paths bridge \
            --collect-all mcp \
            --collect-all pythonosc \
            bridge/server_v07.py

      - name: Smoke-test packaged runtime on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/ai-audio-analyzer-mcp/ai-audio-analyzer-mcp
          AI_ANALYZER_SELF_TEST=1 dist/ai-audio-analyzer-mcp/ai-audio-analyzer-mcp
          file dist/ai-audio-analyzer-mcp/ai-audio-analyzer-mcp

      - name: Smoke-test packaged runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:AI_ANALYZER_SELF_TEST = '1'
          & 'dist/ai-audio-analyzer-mcp/ai-audio-analyzer-mcp.exe'
          if ($LASTEXITCODE -ne 0) { throw "Packaged MCP self-test failed: $LASTEXITCODE" }
          Remove-Item Env:AI_ANALYZER_SELF_TEST -ErrorAction SilentlyContinue

      - name: Stage runtime
        shell: bash
        run: |
          rm -rf runtime-artifact
          mkdir -p runtime-artifact
          cp -R dist/ai-audio-analyzer-mcp runtime-artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: runtime-artifact/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  package-windows:
    name: Build Windows lazy package
    needs: mcp-runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build VST3
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 2
      - uses: actions/download-artifact@v4
        with:
          name: mcp-runtime-windows-x64
          path: input/mcp-runtime

      - name: Assemble Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match($cmake, 'project\(AIAnalyzer VERSION ([0-9.]+)')
          if (-not $match.Success) { throw 'Could not parse project version' }
          $version = $match.Groups[1].Value
          $vst3 = Get-ChildItem build/AIAnalyzer_artefacts -Recurse -Directory -Filter 'AI Audio Analyzer.vst3' | Select-Object -First 1
          if (-not $vst3) { throw 'AI Audio Analyzer.vst3 not found' }

          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Path dist | Out-Null
          $root = Join-Path dist "AI-Audio-Analyzer-v$version-Windows"
          New-Item -ItemType Directory -Path $root | Out-Null

          Copy-Item $vst3.FullName (Join-Path $root 'AI Audio Analyzer.vst3') -Recurse -Force
          New-Item -ItemType Directory -Path (Join-Path $root 'mcp/runtime') -Force | Out-Null
          Copy-Item 'input/mcp-runtime/ai-audio-analyzer-mcp' (Join-Path $root 'mcp/runtime/ai-audio-analyzer-mcp') -Recurse -Force
          New-Item -ItemType Directory -Path (Join-Path $root 'mcp/source') -Force | Out-Null
          Copy-Item bridge/server.py,bridge/server_v05.py,bridge/project_tools.py,bridge/server_v06.py,bridge/temporal_tools.py,bridge/server_v07.py,bridge/masking_tools.py,bridge/requirements.txt,bridge/cherry-studio.example.json (Join-Path $root 'mcp/source/') -Force
          Copy-Item 'skills/ai-analyzer-flstudio' (Join-Path $root 'skill') -Recurse -Force
          Copy-Item release/common/START-HERE.md (Join-Path $root 'START-HERE.md')
          Copy-Item release/common/INSTALL.en.md (Join-Path $root 'INSTALL.en.md')
          Copy-Item release/common/INSTALL.zh-CN.md (Join-Path $root 'INSTALL.zh-CN.md')
          Copy-Item release/windows/Install.ps1 (Join-Path $root 'Install.ps1')
          Copy-Item release/windows/Install.cmd (Join-Path $root 'Install.cmd')

          @"
          AI Audio Analyzer $version
          Platform: Windows x64
          VST3 protocol/measurements: 0.6-compatible temporal frame
          MCP feature layer: 0.7 masking evidence
          MCP: PyInstaller standalone x64 runtime
          Python required for normal install: No
          Release commit: $env:GITHUB_SHA
          "@ | Set-Content (Join-Path $root 'VERSION.txt') -Encoding UTF8

          $null = [scriptblock]::Create((Get-Content (Join-Path $root 'Install.ps1') -Raw))
          $env:AI_ANALYZER_SELF_TEST = '1'
          & (Join-Path $root 'mcp/runtime/ai-audio-analyzer-mcp/ai-audio-analyzer-mcp.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows MCP failed final self-test' }
          Remove-Item Env:AI_ANALYZER_SELF_TEST -ErrorAction SilentlyContinue

          $zip = Join-Path dist "AI-Audio-Analyzer-v$version-Windows.zip"
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash -Algorithm SHA256 $zip | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Analyzer-Release-Windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  package-macos:
    name: Build macOS Apple Silicon lazy package
    needs: mcp-runtime
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build arm64 VST3
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --config Release --parallel 2
      - uses: actions/download-artifact@v4
        with:
          name: mcp-runtime-macos-arm64
          path: input/mcp-arm64

      - name: Assemble macOS package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/.*project\(AIAnalyzer VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | head -1)"
          test -n "$VERSION"
          VST3_PATH="$(find build/AIAnalyzer_artefacts -type d -name 'AI Audio Analyzer.vst3' -print -quit)"
          test -n "$VST3_PATH"
          BINARY="$VST3_PATH/Contents/MacOS/AI Audio Analyzer"
          test "$(lipo -archs "$BINARY")" = "arm64"
          xattr -cr "$VST3_PATH" || true
          codesign --force --deep --sign - --timestamp=none "$VST3_PATH"
          codesign --verify --deep --strict --verbose=4 "$VST3_PATH"

          rm -rf dist
          ROOT="dist/AI-Audio-Analyzer-v${VERSION}-macOS"
          mkdir -p "$ROOT/mcp/runtime" "$ROOT/mcp/source"
          ditto "$VST3_PATH" "$ROOT/AI Audio Analyzer.vst3"
          ditto input/mcp-arm64/ai-audio-analyzer-mcp "$ROOT/mcp/runtime/ai-audio-analyzer-mcp"
          cp bridge/server.py bridge/server_v05.py bridge/project_tools.py bridge/server_v06.py bridge/temporal_tools.py bridge/server_v07.py bridge/masking_tools.py bridge/requirements.txt bridge/cherry-studio.example.json "$ROOT/mcp/source/"
          ditto skills/ai-analyzer-flstudio "$ROOT/skill"
          cp release/common/START-HERE.md "$ROOT/START-HERE.md"
          cp release/common/INSTALL.en.md "$ROOT/INSTALL.en.md"
          cp release/common/INSTALL.zh-CN.md "$ROOT/INSTALL.zh-CN.md"
          cp release/macos/install.sh "$ROOT/install.sh"
          cp release/macos/Install.command "$ROOT/Install.command"
          chmod +x "$ROOT/install.sh" "$ROOT/Install.command"
          chmod +x "$ROOT/mcp/runtime/ai-audio-analyzer-mcp/ai-audio-analyzer-mcp"
          AI_ANALYZER_SELF_TEST=1 "$ROOT/mcp/runtime/ai-audio-analyzer-mcp/ai-audio-analyzer-mcp"

          cat > "$ROOT/VERSION.txt" <<EOF
          AI Audio Analyzer ${VERSION}
          Platform: macOS Apple Silicon arm64
          VST3 protocol/measurements: 0.6-compatible temporal frame
          MCP feature layer: 0.7 masking evidence
          MCP: PyInstaller standalone arm64 runtime
          Python required for normal install: No
          Release commit: ${GITHUB_SHA}
          EOF

          ZIP="dist/AI-Audio-Analyzer-v${VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$ROOT" "$ZIP"
          shasum -a 256 "$ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Analyzer-Release-macOS
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [package-windows, package-macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: AI-Audio-Analyzer-Release-*
          path: release-assets
          merge-multiple: true

      - name: Resolve metadata and checksums
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/.*project\(AIAnalyzer VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | head -1)"
          TAG='${{ inputs.tag }}'
          if [ -z "$TAG" ]; then TAG="v${VERSION}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build release notes
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cat > release-assets/RELEASE-NOTES.md <<EOF
          # AI Audio Analyzer ${TAG}

          - Windows x64 and macOS Apple Silicon arm64 lazy packages.
          - Standalone PyInstaller MCP runtime; normal users do not need Python or PyPI.
          - MCP 0.7 adds equal-ERB-rate re-binned spectral/relative-level/temporal masking evidence and a project masking scan.
          - The 0.7 evidence model is transparent heuristic evidence, not a calibrated cochlear/gammatone filterbank and not a probability of audible masking.
          - VST3 OSC measurement schema remains compatible with 0.6; indexes 0..64 are unchanged.
          - Skill remains English-only and measurement/tool oriented; it does not prescribe a mixing style.

          macOS builds are ad-hoc signed rather than Apple-notarized. The bundled installer handles current quarantine/Gatekeeper requirements.

          Companion FL Studio control MCP: https://github.com/rosasynthesiz/flstudio-mcp
          EOF

      - name: Create or update GitHub Release
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*.zip release-assets/SHA256SUMS.txt)
          if [ "${#files[@]}" -lt 3 ]; then
            echo 'Expected Windows zip, macOS zip and SHA256SUMS.txt' >&2
            exit 1
          fi
          flags=()
          if [ "$PRERELEASE" = 'true' ]; then flags+=(--prerelease); fi
          if [ "$DRAFT" = 'true' ]; then flags+=(--draft); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "AI Audio Analyzer $TAG" --notes-file release-assets/RELEASE-NOTES.md
          else
            gh release create "$TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "AI Audio Analyzer $TAG" \
              --notes-file release-assets/RELEASE-NOTES.md \
              "${flags[@]}"
          fi

      - name: Show release URL
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: gh release view "$TAG" --json url --jq .url
