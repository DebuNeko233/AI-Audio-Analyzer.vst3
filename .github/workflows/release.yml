name: release-lazy-package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag. Leave empty to use v<CMake project version>.'
        required: false
        type: string
      prerelease:
        description: 'Publish as prerelease'
        required: true
        default: false
        type: boolean
      draft:
        description: 'Create/update as draft release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ai-audio-analyzer-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts, docs and MCP source
        shell: bash
        run: |
          set -euo pipefail
          bash -n release/macos/install.sh
          bash -n release/macos/Install.command
          test -s release/windows/Install.ps1
          test -s release/windows/Install.cmd
          test -s release/common/START-HERE.md
          test -s release/common/INSTALL.en.md
          test -s release/common/INSTALL.zh-CN.md
          python -m py_compile \
            bridge/server.py \
            bridge/analyzer_core.py \
            bridge/project_tools.py \
            bridge/temporal_tools.py \
            bridge/masking_tools.py

  mcp-runtime:
    name: MCP runtime (${{ matrix.label }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            artifact: mcp-runtime-windows-x64
          - os: macos-latest
            label: macos-arm64
            artifact: mcp-runtime-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bridge/requirements.txt

      - name: Install MCP build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m pip install 'pyinstaller>=6.10,<7'

      - name: Validate source MCP 0.7
        shell: bash
        run: |
          AI_ANALYZER_SELF_TEST=1 python bridge/server.py

      - name: Build standalone MCP runtime
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            -F \
            --name ai-audio-analyzer-mcp \
            --paths bridge \
            --collect-all mcp \
            --collect-all pythonosc \
            bridge/server.py

      - name: Smoke-test packaged runtime on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/ai-audio-analyzer-mcp
          AI_ANALYZER_SELF_TEST=1 dist/ai-audio-analyzer-mcp
          file dist/ai-audio-analyzer-mcp

      - name: Smoke-test packaged runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:AI_ANALYZER_SELF_TEST = '1'
          & 'dist/ai-audio-analyzer-mcp.exe'
          if ($LASTEXITCODE -ne 0) { throw "Packaged MCP self-test failed: $LASTEXITCODE" }
          Remove-Item Env:AI_ANALYZER_SELF_TEST -ErrorAction SilentlyContinue

      - name: Stage runtime file
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime-artifact
          mkdir -p runtime-artifact
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/ai-audio-analyzer-mcp.exe runtime-artifact/
          else
            cp dist/ai-audio-analyzer-mcp runtime-artifact/
            chmod +x runtime-artifact/ai-audio-analyzer-mcp
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: runtime-artifact/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  package-windows:
    name: Stage Windows beginner package
    needs: mcp-runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build VST3
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 2

      - uses: actions/download-artifact@v4
        with:
          name: mcp-runtime-windows-x64
          path: input/mcp-runtime

      - name: Assemble Windows user folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match($cmake, 'project\(AIAnalyzer VERSION ([0-9.]+)')
          if (-not $match.Success) { throw 'Could not parse project version' }
          $version = $match.Groups[1].Value
          $vst3 = Get-ChildItem build/AIAnalyzer_artefacts -Recurse -Directory -Filter 'AI Audio Analyzer.vst3' | Select-Object -First 1
          if (-not $vst3) { throw 'AI Audio Analyzer.vst3 not found' }

          if (Test-Path package) { Remove-Item package -Recurse -Force }
          New-Item -ItemType Directory -Path 'package/mcp' -Force | Out-Null

          Copy-Item $vst3.FullName 'package/AI Audio Analyzer.vst3' -Recurse -Force
          Copy-Item 'input/mcp-runtime/ai-audio-analyzer-mcp.exe' 'package/mcp/ai-audio-analyzer-mcp.exe' -Force
          Copy-Item 'skills/ai-analyzer-flstudio' 'package/skill' -Recurse -Force
          Copy-Item release/common/START-HERE.md 'package/START-HERE.md'
          Copy-Item release/common/INSTALL.en.md 'package/INSTALL.en.md'
          Copy-Item release/common/INSTALL.zh-CN.md 'package/INSTALL.zh-CN.md'
          Copy-Item release/windows/Install.ps1 'package/Install.ps1'
          Copy-Item release/windows/Install.cmd 'package/Install.cmd'

          @"
          AI Audio Analyzer $version
          Platform: Windows x64
          MCP: 0.7 standalone executable
          OSC protocol: 0.6-compatible
          Release commit: $env:GITHUB_SHA
          "@ | Set-Content 'package/VERSION.txt' -Encoding UTF8

          $null = [scriptblock]::Create((Get-Content 'package/Install.ps1' -Raw))
          $env:AI_ANALYZER_SELF_TEST = '1'
          & 'package/mcp/ai-audio-analyzer-mcp.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows MCP failed final self-test' }
          Remove-Item Env:AI_ANALYZER_SELF_TEST -ErrorAction SilentlyContinue

          $forbidden = Get-ChildItem package -Recurse -File | Where-Object {
            $_.Extension -eq '.py' -or $_.Extension -eq '.zip' -or $_.Name -eq 'requirements.txt' -or $_.Name -eq 'cherry-studio.example.json'
          }
          if ($forbidden) { throw "Forbidden developer/nested archive files in user package: $($forbidden.FullName -join ', ')" }
          if (Test-Path 'package/mcp/source') { throw 'mcp/source must never be present in a user Release.' }

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Analyzer-Package-Windows
          path: package/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  package-macos:
    name: Stage macOS Apple Silicon beginner package
    needs: mcp-runtime
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build arm64 VST3
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --config Release --parallel 2

      - uses: actions/download-artifact@v4
        with:
          name: mcp-runtime-macos-arm64
          path: input/mcp-runtime

      - name: Assemble macOS user folder
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/.*project\(AIAnalyzer VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | head -1)"
          test -n "$VERSION"
          VST3_PATH="$(find build/AIAnalyzer_artefacts -type d -name 'AI Audio Analyzer.vst3' -print -quit)"
          test -n "$VST3_PATH"
          BINARY="$VST3_PATH/Contents/MacOS/AI Audio Analyzer"
          test "$(lipo -archs "$BINARY")" = "arm64"
          xattr -cr "$VST3_PATH" || true
          codesign --force --deep --sign - --timestamp=none "$VST3_PATH"
          codesign --verify --deep --strict --verbose=4 "$VST3_PATH"

          rm -rf package
          mkdir -p package/mcp
          ditto "$VST3_PATH" 'package/AI Audio Analyzer.vst3'
          cp input/mcp-runtime/ai-audio-analyzer-mcp package/mcp/ai-audio-analyzer-mcp
          chmod +x package/mcp/ai-audio-analyzer-mcp
          ditto skills/ai-analyzer-flstudio package/skill
          cp release/common/START-HERE.md package/START-HERE.md
          cp release/common/INSTALL.en.md package/INSTALL.en.md
          cp release/common/INSTALL.zh-CN.md package/INSTALL.zh-CN.md
          cp release/macos/install.sh package/install.sh
          cp release/macos/Install.command package/Install.command
          chmod +x package/install.sh package/Install.command
          AI_ANALYZER_SELF_TEST=1 package/mcp/ai-audio-analyzer-mcp

          cat > package/VERSION.txt <<EOF
          AI Audio Analyzer ${VERSION}
          Platform: macOS Apple Silicon arm64
          MCP: 0.7 standalone executable
          OSC protocol: 0.6-compatible
          Release commit: ${GITHUB_SHA}
          EOF

          if find package -type f \( -name '*.py' -o -name '*.zip' -o -name 'requirements.txt' -o -name 'cherry-studio.example.json' \) | grep -q .; then
            echo 'Forbidden developer/nested archive file found in user package.' >&2
            find package -type f \( -name '*.py' -o -name '*.zip' -o -name 'requirements.txt' -o -name 'cherry-studio.example.json' \) >&2
            exit 1
          fi
          test ! -d package/mcp/source

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Audio-Analyzer-Package-macOS
          path: package/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  publish:
    name: Create single-zip GitHub Release
    needs: [package-windows, package-macos]
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AI-Audio-Analyzer-Package-Windows
          path: staging/windows

      - uses: actions/download-artifact@v4
        with:
          name: AI-Audio-Analyzer-Package-macOS
          path: staging/macos

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/.*project\(AIAnalyzer VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | head -1)"
          TAG='${{ inputs.tag }}'
          if [ -z "$TAG" ]; then TAG="v${VERSION}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create final archives exactly once
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets

          WIN_ROOT="release-assets/AI-Audio-Analyzer-v${VERSION}-Windows"
          MAC_ROOT="release-assets/AI-Audio-Analyzer-v${VERSION}-macOS"
          mkdir -p "$WIN_ROOT" "$MAC_ROOT"
          ditto staging/windows "$WIN_ROOT"
          ditto staging/macos "$MAC_ROOT"

          chmod +x "$MAC_ROOT/install.sh" "$MAC_ROOT/Install.command"
          chmod +x "$MAC_ROOT/mcp/ai-audio-analyzer-mcp"
          chmod +x "$MAC_ROOT/AI Audio Analyzer.vst3/Contents/MacOS/AI Audio Analyzer"

          codesign --verify --deep --strict --verbose=4 "$MAC_ROOT/AI Audio Analyzer.vst3"
          AI_ANALYZER_SELF_TEST=1 "$MAC_ROOT/mcp/ai-audio-analyzer-mcp"

          if find "$WIN_ROOT" "$MAC_ROOT" -type f \( -name '*.py' -o -name '*.zip' -o -name 'requirements.txt' -o -name 'cherry-studio.example.json' \) | grep -q .; then
            echo 'Final user package contains source/developer files or a nested ZIP.' >&2
            find "$WIN_ROOT" "$MAC_ROOT" -type f \( -name '*.py' -o -name '*.zip' -o -name 'requirements.txt' -o -name 'cherry-studio.example.json' \) >&2
            exit 1
          fi
          test ! -d "$WIN_ROOT/mcp/source"
          test ! -d "$MAC_ROOT/mcp/source"

          pushd release-assets >/dev/null
          zip -qry "AI-Audio-Analyzer-v${VERSION}-Windows.zip" "AI-Audio-Analyzer-v${VERSION}-Windows"
          ditto -c -k --sequesterRsrc --keepParent "AI-Audio-Analyzer-v${VERSION}-macOS" "AI-Audio-Analyzer-v${VERSION}-macOS.zip"
          rm -rf "AI-Audio-Analyzer-v${VERSION}-Windows" "AI-Audio-Analyzer-v${VERSION}-macOS"

          if unzip -Z1 "AI-Audio-Analyzer-v${VERSION}-Windows.zip" | grep -Ei '\.zip$'; then
            echo 'Windows Release ZIP contains a nested ZIP.' >&2
            exit 1
          fi
          if unzip -Z1 "AI-Audio-Analyzer-v${VERSION}-macOS.zip" | grep -Ei '\.zip$'; then
            echo 'macOS Release ZIP contains a nested ZIP.' >&2
            exit 1
          fi

          shasum -a 256 *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          popd >/dev/null

      - name: Build beginner-facing release notes
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cat > release-assets/RELEASE-NOTES.md <<EOF
          # AI Audio Analyzer ${TAG}

          Download the package for your computer, unzip it once, and run the installer inside.

          - **Windows:** download `AI-Audio-Analyzer-*-Windows.zip`, unzip it, then double-click `Install.cmd`.
          - **macOS Apple Silicon:** download `AI-Audio-Analyzer-*-macOS.zip`, unzip it, then double-click `Install.command`.
          - No Python, source code, package manager, or programming setup is included or required.
          - Each user package contains the VST3, standalone MCP executable, Cherry Studio Skill, installer, and simple installation guides.
          - macOS Release is Apple Silicon arm64 only and is currently ad-hoc signed rather than Apple-notarized.

          See `START-HERE.md` inside the downloaded package for the shortest setup path.
          EOF

      - name: Create or update GitHub Release
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            brew install gh
          fi

          shopt -s nullglob
          files=(release-assets/*.zip release-assets/SHA256SUMS.txt)
          if [ "${#files[@]}" -lt 3 ]; then
            echo 'Expected Windows zip, macOS zip and SHA256SUMS.txt' >&2
            exit 1
          fi

          flags=()
          if [ "$PRERELEASE" = 'true' ]; then flags+=(--prerelease); fi
          if [ "$DRAFT" = 'true' ]; then flags+=(--draft); fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "AI Audio Analyzer $TAG" --notes-file release-assets/RELEASE-NOTES.md
          else
            gh release create "$TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "AI Audio Analyzer $TAG" \
              --notes-file release-assets/RELEASE-NOTES.md \
              "${flags[@]}"
          fi

      - name: Show release URL
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: gh release view "$TAG" --json url --jq .url
